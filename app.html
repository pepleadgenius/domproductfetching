<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
         display: flex;
         flex-wrap: wrap;
         align-items: center;
         justify-content: center;
    }
</style>
<body>
    
</body>
<script>


    const x = fetch("https://fakestoreapi.com/products")
    
    x.then(data=> data.json()).then((data)=>{
      for(let i=0; i<data.length; i++){
         
        const cardDiv =  document.createElement('div')
        cardDiv.style.height="300px"
       cardDiv.style.width="250px"
       cardDiv.style.backgroundColor="pink"
       cardDiv.style.margin="10px"
       cardDiv.style.display="flex"
       cardDiv.style.flexDirection="column"
       cardDiv.style.alignItems="center"

       const nameTag = document.createElement('p');
       nameTag.innerText=data[i].title.substring(0,30);
       cardDiv.append(nameTag)

    

       const imgTag = document.createElement('img')
       imgTag.src=data[i].image
       imgTag.style.height="150px"
       imgTag.style.width="150px"
       cardDiv.append(imgTag)

       const priceTag = document.createElement('p');
       priceTag.innerText=" ₹ " + data[i].price;
       cardDiv.append(priceTag)

       const orderBtn = document.createElement('button')
       orderBtn.innerText=" 🛍️ "
       orderBtn.style.height="40px"
       orderBtn.style.width="150px"
       orderBtn.style.borderRadius="20px"
       cardDiv.append(orderBtn)
      
       document.body.append(cardDiv)
    }
    })
    .catch()
    

</script>
</html>
